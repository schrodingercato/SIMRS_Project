ass="absolute -bottom-[20%] -right-[10%] w-[60vw] h-[60vw] rounded-full bg-gradient-to-tl from-secondary-container/30 to-surface-container-high/40 blur-3xl"></div><div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-40 bg-[radial-gradient(#006194_0.75px,transparent_0.75px)] [background-size:24px_24px]"></div></div><main class="relative z-10 w-full min-h-screen flex flex-col justify-between p-base lg:p-2xl"><div class="flex flex-col w-full">

</div>
</div>
<div class="mb-6">
<div class="flex items-center justify-between mb-2">
<label class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-wider font-semibold">Pilih Peran Penugasan</label>
<span class="font-label-xs text-label-xs text-primary font-semibold" id="selected-role-name">Dokter Spesialis / DPJP</span>
</div>
<div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5 p-1 bg-surface-container-low rounded-lg" id="role-container">
<button class="role-pill active-role flex flex-col items-center gap-1 py-2.5 px-2 rounded-md transition-all text-center group bg-primary text-on-primary shadow-sm" data-role="dpjp" data-title="Dokter Spesialis / DPJP" type="button">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: &quot;FILL&quot; 1;">stethoscope</span>

</button>
<button class="role-pill flex flex-col items-center gap-1 py-2.5 px-2 rounded-md transition-all text-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container group" data-role="nurse" data-title="Perawat &amp; Tenaga Rawat Inap" type="button">
<span class="material-symbols-outlined text-headline-sm">medical_services</span>

</button>
<button class="role-pill flex flex-col items-center gap-1 py-2.5 px-2 rounded-md transition-all text-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container group" data-role="pharma" data-title="Apoteker &amp; Depo Farmasi" type="button">
<span class="material-symbols-outlined text-headline-sm">prescriptions</span>
<span class="font-label-xs text-label-xs line-clamp-1">Apoteker</span>
</button>
<button class="role-pill flex flex-col items-center gap-1 py-2.5 px-2 rounded-md transition-all text-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container group" data-role="front" data-title="Loket Admisi &amp; Pendaftaran" type="button">
<span class="material-symbols-outlined text-headline-sm">assignment_ind</span>
<span class="font-label-xs text-label-xs line-clamp-1">Pendaftaran</span>
</button>
<button class="role-pill col-span-2 sm:col-span-1 flex flex-col items-center gap-1 py-2.5 px-2 rounded-md transition-all text-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container group" data-role="itadmin" data-title="Administrator IT &amp; Rekam Medis" type="button">
<span class="material-symbols-outlined text-headline-sm">shield_person</span>

</button>

<form class="space-y-4" id="simrs-login-form" onsubmit="event.preventDefault(); handleSimrsLogin();">
<div>
<label class="block font-label-md text-label-md text-on-surface font-semibold mb-1.5" for="nip_input">
                NIP Pegawai / ID Karyawan / Email Resmi
              </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-headline-sm text-outline pointer-events-none">badge</span>
<input class="w-full h-11 pl-11 pr-4 bg-surface-container-low rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all" id="nip_input" name="nip" placeholder="Contoh: 198805202021021004 atau dokter@sehatnusantara.id" required="" type="text">
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="pass_input">
                  Kata Sandi Portal
                </label>
<a class="font-label-xs text-label-xs text-primary hover:text-primary-container font-semibold transition-colors" href="#reset-password" onclick="alert('Silakan hubungi IT Helpdesk (Ext. 102) atau kunjungi Ruang Server Gedung A Lantai 2 untuk reset kredensial biometrik dan sandi staf medis.')">
                  Lupa Kata Sandi?
                </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-headline-sm text-outline pointer-events-none">lock</span>
<input class="w-full h-11 pl-11 pr-11 bg-surface-container-low rounded-lg text-on-surface font-body-md text-body-md placeholder:text-outline focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all" id="pass_input" name="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle Password Visibility" class="absolute right-3.5 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-headline-sm" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface font-semibold mb-1.5" for="clinic_unit_input">
                Stasiun / Poliklinik Tugas Aktif
              </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-headline-sm text-outline pointer-events-none">domain</span>
<select class="w-full h-11 pl-11 pr-10 bg-surface-container-low rounded-lg text-on-surface font-body-md text-body-md appearance-none focus:bg-surface-container-lowest focus:outline-none focus:shadow-md transition-all cursor-pointer" id="clinic_unit_input" name="clinic_unit">
<option value="poli_internal">Poli Spesialis Penyakit Dalam (Gedung B Lt. 2)</option>
<option value="poli_pediatric">Poli Tumbuh Kembang Anak (Gedung B Lt. 1)</option>
<option value="igd_emergency">Instalasi Gawat Darurat (IGD 24 Jam - Zona Merah/Kuning)</option>
<option value="pharmacy_central">Depo Farmasi Sentral &amp; Rawat Inap (Gedung A Lt. 1)</option>
<option value="admission_counter">Loket Admisi Pendaftaran &amp; Bridging BPJS (Lobby Utama)</option>
<option value="icu_hcu">Intensive Care Unit (ICU / ICCU Gedung C)</option>
</select>
<span class="material-symbols-outlined absolute right-3.5 text-headline-sm text-outline pointer-events-none">expand_more</span>
</div>
</div>

<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary bg-surface-container-high focus:ring-0 cursor-pointer" id="remember_session" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">
                  Ingat sesi pada terminal workstation ini&nbsp;</span>
</label>
<button class="inline-flex items-center gap-1.5 text-primary hover:text-primary-container font-label-md text-label-md font-semibold transition-colors text-left" onclick="handleSmartCardLogin()" type="button">


</button>

<div class="pt-3">
<button class="w-full h-12 rounded-lg bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-lg shadow-primary/25 transition-all transform active:scale-[0.99]" id="login-submit-btn" type="submit">
<span class="material-symbols-outlined text-headline-md">login</span>
<span class="">Masuk ke Sistem SIMRS</span>
</button>

<div class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-4 mt-8 pt-4 text-on-surface-variant">
<div class="flex items-center gap-2">

<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-password-btn');
  const passInput = document.getElementById('pass_input');
  const toggleIcon = document.getElementById('toggle-password-icon');

  if (toggleBtn && passInput && toggleIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggleIcon.textContent = isPass ? 'visibility_off' : 'visibility';
    });
  }

  // Interactive Role Selector
  const roleButtons = document.querySelectorAll('.role-pill');
  const roleNameDisplay = document.getElementById('selected-role-name');

  roleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      roleButtons.forEach(b => {
        b.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm', 'active-role');
        b.classList.add('text-on-surface-variant');
      });

      btn.classList.remove('text-on-surface-variant');
      btn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm', 'active-role');

      const title = btn.getAttribute('data-title');
      if (roleNameDisplay && title) {
        roleNameDisplay.textContent = title;
      }
    });
  });

  // Simulated Login Handler
  function handleSimrsLogin() {
    const nip = document.getElementById('nip_input').value;
    const unitSelect = document.getElementById('clinic_unit_input');
    const unitText = unitSelect.options[unitSelect.selectedIndex].text;
    const submitBtn = document.getElementById('login-submit-btn');

    if (!nip) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-on-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>Mengautentikasi Kredensial Medis...</span>
    `;

    setTimeout(() => {
      submitBtn.classList.remove('bg-primary', 'hover:bg-primary-container');
      submitBtn.classList.add('bg-secondary', 'text-on-secondary');
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-headline-md">check_circle</span>
        <span>Otentikasi Berhasil! Mengalihkan...</span>
      `;
      setTimeout(() => {
        alert('Autentikasi Berhasil.\nPengguna: ' + nip + '\nUnit Tugas: ' + unitText + '\n\nMembuka Dashboard Rekam Medis SIMRS...');
        submitBtn.disabled = false;
        submitBtn.classList.remove('bg-secondary', 'text-on-secondary');
        submitBtn.classList.add('bg-primary', 'hover:bg-primary-container');
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-headline-md">login</span>
          <span>Masuk ke Sistem SIMRS</span>
        `;
      }, 900);
    }, 1200);
  }

  function handleSmartCardLogin() {
    alert('Silakan dekatkan Kartu Tanda Pengenal Rumah Sakit (Smart Card / NFC Staff) ke sensor pembaca di workstation Anda.');
  }
</script></main>
